# Configuración de Nginx para AdminCUSC
# Servidor: 137.184.188.234
# Para copiar a /etc/nginx/sites-available/admincusc
# y crear un enlace simbólico en /etc/nginx/sites-enabled/

# Configuración HTTP (redirigir a HTTPS si tienes dominio con SSL)
# Si solo usas IP, comenta las líneas de SSL y descomenta la sección HTTP simple

# Redirigir HTTP a HTTPS (descomentar si tienes dominio)
# server {
#     listen 80;
#     server_name tu-dominio.com www.tu-dominio.com;
#     
#     # Redirigir todo el tráfico HTTP a HTTPS
#     return 301 https://$server_name$request_uri;
# }

# Configuración principal (HTTP sin SSL para empezar)
server {
    listen 80;
    server_name 137.184.188.234;
    
    # Tamaño máximo de archivos subidos
    client_max_body_size 10M;

    # Bloquear rutas sensibles (scanners): devolver 404 sin pasar al backend
    location ~* ^/(\.env|\.env\.|\.git|config\.json|config\.js|credentials\.json|keyfile\.json|service-account\.json|appsettings\.json|application\.yml|\.npmrc|\.pgpass|wp-config\.php|configuration\.php|settings\.php|docker-compose\.|\.svn/|actuator/|debug/|phpinfo\.php) {
        return 404;
        access_log off;
    }

    # Archivos estáticos y media
    location /static/ {
        alias /var/www/admincusc/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/admincusc/backend/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Proxy al servidor Django (Gunicorn)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Headers de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

# HTTPS con certificado autofirmado (solo IP, ver docs/HTTPS_CERTIFICADO_AUTOFIRMADO_IP.md)
# Generar cert: openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#   -keyout /etc/ssl/private/admincusc-selfsigned.key -out /etc/ssl/certs/admincusc-selfsigned.crt \
#   -subj "/CN=137.184.188.234" -addext "subjectAltName=IP:137.184.188.234"
server {
    listen 443 ssl http2;
    server_name 137.184.188.234;

    ssl_certificate     /etc/ssl/certs/admincusc-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/admincusc-selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 10M;

    location ~* ^/(\.env|\.env\.|\.git|config\.json|config\.js|credentials\.json|keyfile\.json|service-account\.json|appsettings\.json|application\.yml|\.npmrc|\.pgpass|wp-config\.php|configuration\.php|settings\.php|docker-compose\.|\.svn/|actuator/|debug/|phpinfo\.php) {
        return 404;
        access_log off;
    }

    location /static/ {
        alias /var/www/admincusc/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/admincusc/backend/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

